<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow: hidden;
}

/* SCREEN SHAKE */
@keyframes shake {
    0% { transform: translate(0,0); }
    20% { transform: translate(-10px, 10px); }
    40% { transform: translate(10px, -10px); }
    60% { transform: translate(-10px, 5px); }
    80% { transform: translate(10px, -5px); }
    100% { transform: translate(0,0); }
}

.shake {
    animation: shake 0.5s;
}

/* GLASS */
.container {
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 20px;
    max-width: 950px;
    width: 92%;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    text-align: center;
}

/* HEARTS */
.heart {
    position: fixed;
    bottom: -20px;
    color: red;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-110vh); opacity: 0; }
}

/* KISS */
.kiss {
    position: fixed;
    font-size: 30px;
    animation: kissFloat 2s ease-out forwards;
}

@keyframes kissFloat {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(2) translateY(-200px); opacity: 0; }
}

/* TYPING */
.typing {
    white-space: pre-line;
    border-right: 3px solid #ff4d6d;
    display: inline-block;
    animation: blink 0.8s infinite;
    line-height: 1.7;
    font-size: 17px;
}

@keyframes blink {
    50% { border-color: transparent; }
}

.page {
    display: none;
    height: 100vh;
    justify-content: center;
    align-items: center;
}

.active {
    display: flex;
}

button {
    padding: 15px 25px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    margin: 10px;
    cursor: pointer;
}

.yes { background: #ff4d6d; color: white; }
.no { background: gray; color: white; position: absolute; }

img {
    width: 220px;
    border-radius: 15px;
    margin: 10px;
}

.gift-box { font-size: 80px; cursor: pointer; }
.hidden { display: none; }

</style>
</head>

/* MUSIC */
document.body.addEventListener("click",()=>{bgMusic.play()},{once:true});

/* TYPE */
function typeText(id,text,speed=25){
let el=document.getElementById(id);
if(!el) return;
el.innerHTML="";
let i=0;
(function t(){
if(i<text.length){

setTimeout(t,speed);
}
})();
}
